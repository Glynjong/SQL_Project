version: '3.8'

services:
  # PostgreSQL Database (custom image: postgres:15-alpine + ProvSQL extension)
  postgres:
    build: ./Postgres
    container_name: sql-debugger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: SQL_Database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sql-debugger-network

  # Backend Server
  backend:
    build: ./Backend
    container_name: sql-debugger-backend
    ports:
      - "5000:5000"
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DB_USER: postgres
      DB_PASSWORD: 1
      DB_HOST: postgres # FIXED: Use container service name instead of host.docker.internal
      DB_PORT: 5432
      DB_NAME: SQL_Database
    command: npm run dev
    networks:
      - sql-debugger-network
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts: # FIXED: Enables reliable host resolution across Docker environments
      - "host.docker.internal:host-gateway"

  # Frontend Server
  frontend:
    build: ./Frontend
    container_name: sql-debugger-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend/src:/app/src
      - ./Frontend/public:/app/public
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CI=false
    command: npm start
    depends_on:
      - backend
    networks:
      - sql-debugger-network

  # pgAdmin4 - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sql-debugger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - sql-debugger-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the "postgres" service as a server in pgAdmin's tree.
      # Only imported the first time pgAdmin initializes its config db inside
      # pgadmin_data (see DOCKER_GUIDE.md's "down -v" note) — after that,
      # edits here won't apply to an already-initialized volume.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  backend_node_modules:

networks:
  sql-debugger-network:
    driver: bridge